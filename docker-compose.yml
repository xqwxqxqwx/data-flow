name: data-flow

services:
  # ---------- Infra ----------
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb -p local/warehouse || true
        mc mb -p local/raw || true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse-init:
    image: curlimages/curl:8.12.1
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./docker/clickhouse/init:/init:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
        until curl -sf "http://clickhouse:8123/ping" >/dev/null; do sleep 2; done
        for f in /init/*.sql; do
          [ -f "$$f" ] || continue
          curl -sS "http://clickhouse:8123/?multiquery=1" --data-binary "@$$f" >/dev/null
        done
        echo "ClickHouse init SQL executed."

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
      - --log.level=info

  clickhouse-exporter:
    image: f1yegor/clickhouse-exporter:latest
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "9116:9116"
    environment:
      CLICKHOUSE_URL: http://analytics:analytics@clickhouse:8123/
      TELEMETRY: "false"

  statsd-exporter:
    image: prom/statsd-exporter:v0.27.2
    ports:
      - "9102:9102"
      - "9125:9125/udp"

  # ---------- Databases ----------
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-source:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
      POSTGRES_DB: source
    ports:
      - "5434:5432"
    volumes:
      - pg_source_data:/var/lib/postgresql/data
      - ./docker/postgres-source/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d source"]
      interval: 5s
      timeout: 5s
      retries: 20

  debezium:
    image: quay.io/debezium/connect:3.0
    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "debezium-connect"
      CONFIG_STORAGE_TOPIC: "connect_configs"
      OFFSET_STORAGE_TOPIC: "connect_offsets"
      STATUS_STORAGE_TOPIC: "connect_status"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  debezium-init:
    image: curlimages/curl:8.12.1
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./docker/debezium:/config:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -e
        until curl -sf http://debezium:8083/; do sleep 2; done
        curl -sS -X PUT -H 'Content-Type: application/json' \
          http://debezium:8083/connectors/pg-source-orders/config \
          --data @/config/pg-source-orders.json >/dev/null
        echo "Debezium connector configured."

  # ---------- Spark + Iceberg ----------
  spark-master:
    build:
      context: ./docker/spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark-apps
    depends_on:
      minio-init:
        condition: service_completed_successfully

  spark-worker:
    build:
      context: ./docker/spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "3"
      - --memory
      - "2g"
      - --webui-port
      - "8081"
    ports:
      - "8081:8081"
    cpus: 2.0
    mem_limit: 3g
    volumes:
      - ./spark:/opt/spark-apps
    depends_on:
      - spark-master

  spark-worker-2:
    build:
      context: ./docker/spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8082"
    ports:
      - "8082:8082"
    cpus: 1.5
    mem_limit: 2g
    volumes:
      - ./spark:/opt/spark-apps
    depends_on:
      - spark-master

  # ---------- Flink Streaming ----------
  flink-jobmanager:
    build:
      context: ./docker/flink
    command:
      - /bin/bash
      - -lc
      - |
        /docker-entrypoint.sh jobmanager &
        JM_PID=$$!
        echo "Waiting for JobManager REST to become available..."
        until /opt/flink/bin/flink list -r >/dev/null 2>&1; do
          sleep 2
        done
        echo "Submitting streaming SQL job..."
        /opt/flink/bin/sql-client.sh -f /opt/flink/sql/orders_streaming_all.sql
        wait $$JM_PID
    volumes:
      - ./docker/flink/sql:/opt/flink/sql:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
    ports:
      - "8087:8081"
      - "6123:6123"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  flink-taskmanager:
    build:
      context: ./docker/flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 3
    depends_on:
      - flink-jobmanager

  flink-sql-runner:
    build:
      context: ./docker/flink
    profiles: ["flink-manual"]
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    volumes:
      - ./docker/flink/sql:/opt/flink/sql:ro
    command:
      - /bin/bash
      - -lc
      - |
        cat /opt/flink/sql/orders_streaming_all.sql | tr -d '\r' | /opt/flink/bin/sql-client.sh \
          -Dexecution.target=remote \
          -Dexecution.remote.host=flink-jobmanager \
          -Dexecution.remote.port=8081

  kafka-orders-producer:
    image: data-flow-airflow:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_STREAM_TOPIC: orders_events_stream
      PRODUCER_INTERVAL_SEC: "0.5"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    command: >
      bash -lc "python /opt/airflow/dags/kafka/produce_orders_events_stream.py"

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    depends_on:
      spark-master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8889:8888"
      - "4040:4040"
      - "7078:7078"
      - "7079:7079"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-dataflow}
      SPARK_MASTER: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      PYSPARK_SUBMIT_ARGS: >
        --master spark://spark-master:7077
        --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.4
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.local=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.local.type=hadoop
        --conf spark.sql.catalog.local.warehouse=s3a://warehouse/iceberg
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        --conf spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER:-minio}
        --conf spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD:-minio12345}
        pyspark-shell
    volumes:
      - ./notebooks:/home/jovyan/work

  # ---------- Airflow ----------
  airflow:
    image: data-flow-airflow:latest
    depends_on:
      postgres-airflow:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      spark-worker-2:
        condition: service_started
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      postgres-source:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "dev-secret-key"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"

      # Connections for DAGs (read by our scripts/operators)
      SOURCE_PG_HOST: postgres-source
      SOURCE_PG_PORT: "5432"
      SOURCE_PG_DB: source
      SOURCE_PG_USER: source
      SOURCE_PG_PASSWORD: source

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      MINIO_WAREHOUSE_BUCKET: warehouse

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics

      KAFKA_BOOTSTRAP: kafka:9092

      # Optional: Telegram alerting for DAG failures
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8088:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/dbt
      - ./spark:/opt/spark-apps:ro
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true &&
      airflow scheduler & airflow webserver
      "

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      - statsd-exporter
      - kafka-exporter
      - clickhouse-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.2
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  minio_data:
  clickhouse_data:
  kafka_data:
  pg_airflow_data:
  pg_source_data:
  grafana_data:
